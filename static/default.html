<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Hi!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* You can find fonts here: https://bunny.net/fonts/ */
    @import url(https://fonts.bunny.net/css?family=dm-mono:300,500);

    html {
      background: #080f14;
      color: #fff;
      font-family: "dm-mono", monospace;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
    }

    body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }

    main {
      width: 100%;
      max-width: 800px;
      margin: 2rem;
    }

    nav {
      border-bottom: 1px solid #8be2ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    code {
      color: #8be2ff;
      font-size: 1rem;
      background: #152734;
      padding: 0.2rem 0.2rem;
      border-radius: 0.25rem;
    }

    a {
      color: #8be2ff;
      text-decoration: underline;
      text-decoration-style: dotted;
    }
  </style>
</head>

<body>
  <main>
    <nav>
      <h1>Hi there!</h1>
      <a href="https://dawdle.space"><- back to dawdle.space</a>
    </nav>
    <p>
      This is your new site! You can change this page by editing the
      <code>index.html</code> file in your site's directory.
    </p>
  </main>
</body>

</html>
