[package]
name="dawdle-server"
version="0.1.0"
edition="2024"

[[bin]]
name="dawdle-server"
path="main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# tools
eyre="0.6"
env_logger="0.11"
log="0.4"
futures="0.3"
tokio={version="1.42", features=["macros"]}
data-encoding="2.7"

# common dependencies
serde="1.0"
serde_json="1.0"
toml="0.8"
cuid2="0.1"
dashmap="6.0"
rand="0.8"
time={version="0.3", features=["serde"]}
argon2={version="0.5", features=["std"]}
ssh-key={version="0.6", features=["ed25519"]}

# webdav
dav-server={version="0.7", features=["actix-web", "actix-compat"]}

# web dependencies
addr="0.15"
comrak="0.35"
awc={version="3.0", features=["rustls"]}

russh={version="0.50"}
russh-sftp={version="2.0.8"}
async-trait="0.1"

sqlx={version="0.8.3", features=["runtime-tokio", "sqlite", "time"]}
actix-web={version="4.9", features=["cookies"]}
actix-files="0.6"
utoipa={version="5.3", features=["time", "actix_extras"]}
utoipa-actix-web={version="0.1"}
